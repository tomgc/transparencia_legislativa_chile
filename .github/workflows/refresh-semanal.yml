# =============================================================================
# refresh-semanal.yml - Actualizacion automatica del corpus (pendiente 3)
# -----------------------------------------------------------------------------
# Materializa el esqueleto de 50_documentacion/activa/procedimiento_actualizacion.md
# El YAML SOLO orquesta (checkout, R, correr comandos): la logica de negocio vive
# en R (00_run_all.R, 10_diff_conteos.R). Lo unico que la automatizacion aporta
# es CALCULAR el corte (fecha de hoy) e inyectarlo como CORTE_FECHA; el resto es
# el run_all() ya existente.
#
# Decisiones fijadas en diseno (sesion 4): el corte se inyecta con sed sobre
# 10_configuracion.R; el push usa el GITHUB_TOKEN automatico (sin PAT); el gate
# de conteos aborta el job (sin commit ni push) ante cualquier caida.
#
# P-22 (sesion 13): el bot YA NO escribe en main. Commitea en una rama
# refresh/<corte> y abre un PR contra main, que el titular revisa y mergea a
# mano. Motivo: el bot y el trabajo manual competian por main y eso cobro peaje
# tres veces (rebase en s9, fast-forward en s10, riesgo vivo en s12).
#
# CONSECUENCIA ASUMIDA: GitHub Pages republica docs/ al mergear el PR, no al
# terminar el job. El dato en produccion queda tan fresco como la cadencia de
# revision del titular. Es el costo deliberado de que main no se mueva sola.
#
# Sobre el push forzado: la rama refresh/<corte> es propiedad del bot y se
# reconstruye desde el HEAD de main en cada corrida, de modo que forzar sobre
# ella es la semantica correcta ("el refresh de esa fecha") y no puede perder
# trabajo humano. El force esta restringido por refspec a refresh/*: main nunca
# se toca.
# =============================================================================
name: refresh semanal del corpus

on:
  schedule:
    # Lunes 11:00 UTC = 07:00 en Chile (CLT, UTC-4, invierno austral) /
    # 08:00 (CLST, UTC-3, verano). El cron de Actions es SIEMPRE UTC y no ajusta
    # por horario de verano; 11:00 UTC cae temprano el lunes en Chile todo el anno.
    - cron: "0 11 * * 1"
  workflow_dispatch: {}   # ejecucion manual a demanda desde la pestana Actions

# GITHUB_TOKEN automatico con permiso de escritura para commit + push del refresh
# y de apertura de pull requests. No se usa ni referencia un PAT dedicado.
permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Instalar R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true   # repositorio de binarios (RSPM) -> instalacion rapida

      - name: Instalar paquetes R del pipeline
        run: |
          Rscript -e 'install.packages(c("dplyr","jsonlite","here","fs","httr","xml2","rprojroot"))'

      - name: Calcular corte, respaldar JSON previo e inyectar CORTE_FECHA
        env:
          JSON_PREVIO: ${{ runner.temp }}/json_previo
        run: |
          CORTE=$(date +%Y-%m-%d)
          echo "CORTE=$CORTE" >> "$GITHUB_ENV"
          # JSON "anterior" = el del commit ya presente en el checkout (HEAD),
          # copiado ANTES de que run_all lo sobrescriba. Es el equivalente a
          # 'git show HEAD:40_salidas/json/...' pero sobre el arbol ya checkouteado
          # (no un respaldo local persistente, que no existe en el runner).
          cp -r 40_salidas/json "$JSON_PREVIO"
          # Inyectar el corte en la UNICA linea de asignacion (los comentarios
          # que mencionan CORTE_FECHA empiezan con '#', no matchean '^CORTE_FECHA').
          sed -i "s/^CORTE_FECHA <- .*/CORTE_FECHA <- \"$CORTE\"/" 10_utils/10_configuracion.R
          echo "Corte del refresh: $CORTE"
          grep -n '^CORTE_FECHA <- ' 10_utils/10_configuracion.R

      - name: Correr el pipeline (run_all)
        run: |
          Rscript -e 'source("00_run_all.R"); run_all()'

      - name: Gate de conteos (aborta el job si hubo caida)
        env:
          JSON_PREVIO: ${{ runner.temp }}/json_previo
          RESUMEN: ${{ runner.temp }}/resumen_diff.txt
        run: |
          Rscript -e '
            source("10_utils/10_diff_conteos.R")
            # capture.output imprime la tabla Y asigna el retorno (con $gate).
            salida <- capture.output(r <- diff_conteos_json(Sys.getenv("JSON_PREVIO"),
                                                            "40_salidas/json"))
            writeLines(salida, Sys.getenv("RESUMEN"))
            cat(salida, sep = "\n")
            if (identical(r$gate, "FAIL")) {
              cat("\n### GATE FALLIDO -> NO se publica ###\n")
              cat(paste0("  - ", r$motivos), sep = "\n"); cat("\n")
              quit(status = 1)   # falla el step -> job en rojo, sin rama ni PR
            }
            cat("\n### GATE OK -> se publica ###\n")
          '

      - name: Commit en rama y apertura del PR
        env:
          RESUMEN: ${{ runner.temp }}/resumen_diff.txt
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # requerido por la CLI gh
        run: |
          RAMA="refresh/${CORTE}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # La rama nace del HEAD de main ya checkouteado. Crearla no publica nada:
          # si el commit condicional de abajo sale por 'exit 0', no hay push ni PR.
          git checkout -b "$RAMA"
          # El commit incluye el cambio de CORTE_FECHA junto con los datos.
          # P-99: la lista de rutas de captura cruda NO vive aqui. El YAML se la
          # pregunta a R, que ya la declara en DIRECTORIOS_CRUDO (10_utils.R), via
          # rutas_versionables_crudo(). Dos listas que deben coincidir y nada que lo
          # obligue es justo el defecto que esto cierra: la enumeracion a mano se
          # quedo en el mundo previo al paso 37 y dejaba 20_insumos/senado/ sin
          # versionar. El regimen sigue CERRADO: solo entra lo que R declara, y la
          # validacion de mas abajo mata el job si el staged trae otra cosa.
          RUTAS_CRUDO=$(Rscript -e 'source("10_utils/10_utils.R"); cat(rutas_versionables_crudo(), sep=" ")')
          if [ -z "$RUTAS_CRUDO" ]; then
            echo "rutas_versionables_crudo() devolvio vacio: un git add sin esas rutas"
            echo "degradaria el conjunto en silencio. Abortado."
            exit 1
          fi
          echo "Rutas de crudo declaradas en R: ${RUTAS_CRUDO}"
          git add 10_utils/10_configuracion.R $RUTAS_CRUDO 40_salidas/json docs/data
          echo "--- inventario staged ---"
          git diff --cached --name-only | sed "s|^|  staged: |"
          # Compuerta mecanica (P-99): ninguna ruta llega al commit sin estar
          # declarada. .gitignore pasa a ser segunda linea de defensa, no la unica.
          Rscript -e '
            source("10_utils/10_utils.R")
            permitidas <- c("10_utils/10_configuracion.R", "40_salidas/json",
                            "docs/data", rutas_versionables_crudo())
            staged <- system2("git", c("diff", "--cached", "--name-only"), stdout = TRUE)
            declarada <- function(x) any(x == permitidas | startsWith(x, paste0(permitidas, "/")))
            ok <- vapply(staged, declarada, logical(1), USE.NAMES = FALSE)
            cat(sprintf("Validacion del staged: %d rutas, %d declaradas.\n",
                        length(staged), sum(ok)))
            if (any(!ok)) {
              cat("\n### RUTA INTRUSA EN EL STAGED -> NO se publica ###\n")
              cat(paste0("  - ", staged[!ok]), sep = "\n"); cat("\n")
              cat("Declaradas: ", paste(permitidas, collapse = ", "), "\n", sep = "")
              quit(status = 1)
            }
          '
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear (corpus identico al corte previo)."
            echo "No se publica rama ni se abre PR."
            exit 0
          fi
          {
            echo "data: refresh corte ${CORTE} (automatizado)"
            echo
            echo "Resumen de conteos (previo -> nuevo):"
            echo
            cat "$RESUMEN"
          } > "${RUNNER_TEMP}/commit_msg.txt"
          git commit -F "${RUNNER_TEMP}/commit_msg.txt"
          # Force acotado por refspec a la rama del bot; main queda fuera del alcance.
          git push --force origin "HEAD:refs/heads/${RAMA}"
          # Un PR por rama: si ya hay uno abierto para este corte (re-corrida del
          # mismo dia via workflow_dispatch), el push de arriba lo actualiza y no
          # se abre un segundo.
          PR_ABIERTO=$(gh pr list --head "$RAMA" --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR_ABIERTO" ]; then
            echo "PR #${PR_ABIERTO} ya abierto para ${RAMA}; actualizado con el push."
          else
            gh pr create \
              --base main \
              --head "$RAMA" \
              --title "data: refresh corte ${CORTE} (automatizado)" \
              --body-file "${RUNNER_TEMP}/commit_msg.txt"
          fi
          # GitHub Pages republica docs/ al MERGEAR el PR, no al terminar el job.
